name: gate

# The whole quality gate in one job: formatting, warnings-as-errors type
# checking, the 87-test suite on both backends, the executable (five
# pipelines, incl. the Hexad ring-vs-LFM-k-NN comparison), the exported
# CSV traces, all four HTML reports, and the (strict) dead-code scan.
#
# We also assert that everything the run produces is byte-identical to what is
# committed: the traces and reports are *derived* artefacts, so a diff here
# means a numeric result drifted.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Channel of the MoonBit toolchain.  Set to a release identifier
  # (e.g. `v0.10.22`) to pin the gate to a frozen compiler instead of `latest`.
  MOON_VERSION: latest

jobs:
  gate:
    name: fmt + check + test (wasm, js) + build + artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit (${MOON_VERSION}, official installer, SHA-256 verified)
        run: ./scripts/install-moonbit.sh "$MOON_VERSION"

      - name: Put moon on PATH
        run: echo "${MOON_HOME:-$HOME/.moon}/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: moon version --all

      - name: Quality gate
        run: ./scripts/verify.sh

      - name: Committed artefacts match a fresh run
        run: |
          git diff --stat
          git diff --exit-code

      - name: Upload reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-and-traces
          if-no-files-found: error
          path: |
            docs/report_correspondence.html
            correspondence_trace.csv
            jacobi_spectrum.csv
            docs/report.html
            docs/report_langlands.html
            docs/report_frontier.html
            docs/report_universe.html
            emergence_trace.csv
            langlands_trace.csv
            frontier_trace.csv
            universe_trace.csv
            hexad_trace.csv
            run_output.txt
